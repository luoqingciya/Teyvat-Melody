<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
<title>提瓦特旋律</title>
<style>
  html, body { margin: 0; height: 100%; background: #0A0E1A; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; user-select: none;
  }
  .spinner {
    width: 44px; height: 44px; border-radius: 50%;
    border: 3px solid rgba(255, 215, 107, 0.18);
    border-top-color: #FFD76B;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { color: #FFD76B; font-size: 16px; letter-spacing: 2px; font-family: "Microsoft YaHei", sans-serif; }
  .hint { color: rgba(255, 255, 255, 0.45); font-size: 12px; font-family: "Microsoft YaHei", sans-serif; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <div class="title">提瓦特旋律</div>
  <div class="hint">正在唤醒世界树…</div>
</body>
</html>
