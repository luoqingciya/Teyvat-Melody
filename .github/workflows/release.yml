name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 需要 contents: write 才能创建 Release 并上传产物
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows build (installer + portable zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # 打 tag 时校验版本一致性：产物名取自 package.json 的 version，
      # 与 tag 不符会产出「版本号对不上」的安装包，宁可直接失败。
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG  tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 $PKG 不一致"
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: |
          uv sync --frozen
          npm ci
          npm --prefix frontend ci

      - name: Tests
        shell: bash
        run: |
          node tests/run.js
          uv run python tests/online-proxy.test.py

      - name: Build frontend
        run: npm run build:frontend

      - name: Package backend (PyInstaller)
        run: uv run pyinstaller build.spec --noconfirm --distpath backend-dist --workpath build-temp

      - name: Package Electron (NSIS installer + portable zip)
        run: npm run build
        env:
          # 未配置签名证书：关闭自动发现，避免 electron-builder 卡在签名探测
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List artifacts
        shell: bash
        run: ls -lh electron-dist

      - uses: actions/upload-artifact@v7
        with:
          name: TeyvatMelody-windows
          if-no-files-found: error
          path: |
            electron-dist/*.exe
            electron-dist/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" electron-dist/*.exe electron-dist/*.zip --clobber
          echo "已发布：$TAG"
