name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 需要 contents: write 才能创建 Release 并上传产物
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows build (installer + portable zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # 打 tag 时校验版本一致性：产物名取自 package.json 的 version，
      # 与 tag 不符会产出「版本号对不上」的安装包，宁可直接失败。
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG  tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 $PKG 不一致"
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: |
          uv sync --frozen
          npm ci
          npm --prefix frontend ci

      - name: Tests
        shell: bash
        run: |
          node tests/run.js
          uv run python tests/run.py

      - name: Build frontend
        run: npm run build:frontend

      - name: Package backend (PyInstaller)
        run: uv run pyinstaller build.spec --noconfirm --distpath backend-dist --workpath build-temp

      - name: Package Electron (NSIS installer + portable zip)
        run: npm run build
        env:
          # 未配置签名证书：关闭自动发现，避免 electron-builder 卡在签名探测
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List artifacts
        shell: bash
        run: ls -lh electron-dist

      - uses: actions/upload-artifact@v7
        with:
          name: TeyvatMelody-windows
          if-no-files-found: error
          path: |
            electron-dist/*.exe
            electron-dist/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="docs/releases/${TAG}.md"
          # 手写发布说明优先（面向用户的功能亮点），没有则退回自动生成的提交列表
          if [ -f "$NOTES" ]; then
            NOTES_ARGS=(--notes-file "$NOTES")
            echo "使用手写发布说明：$NOTES"
          else
            NOTES_ARGS=(--generate-notes)
            echo "未找到 $NOTES，使用自动生成的发布说明"
          fi
          # 先 view 再决定 create/edit：重跑或补发时不会因「Release 已存在」而失败
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${NOTES_ARGS[@]}"
          else
            gh release create "$TAG" --title "$TAG" "${NOTES_ARGS[@]}"
          fi
          gh release upload "$TAG" electron-dist/*.exe electron-dist/*.zip --clobber
          echo "已发布：$TAG"

  linux:
    name: Linux build (AppImage + tar.gz)
    # ⚠️ 用 22.04 而不是 ubuntu-latest：AppImage 会把构建环境的 glibc 版本带进产物，
    #    在 24.04 上构建出来的包在老发行版上会直接报 glibc 版本不够。
    #    22.04 的 glibc 更老，兼容面更广。
    runs-on: ubuntu-22.04
    # 两个平台都要往同一个 Release 传产物，串行执行避免「同时创建 Release」互相打架
    needs: windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG  tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 $PKG 不一致"
            exit 1
          fi

      - name: Install dependencies
        run: |
          uv sync --frozen
          npm ci
          npm --prefix frontend ci

      - name: Tests
        run: |
          node tests/run.js
          uv run python tests/run.py

      - name: Build frontend
        run: npm run build:frontend

      - name: Package backend (PyInstaller)
        run: uv run pyinstaller build.spec --noconfirm --distpath backend-dist --workpath build-temp

      - name: Package Electron (AppImage + tar.gz)
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List artifacts
        run: ls -lh electron-dist

      - uses: actions/upload-artifact@v7
        with:
          name: TeyvatMelody-linux
          if-no-files-found: error
          path: |
            electron-dist/*.AppImage
            electron-dist/*.tar.gz

      - name: Publish GitHub Release (Linux assets)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Release 由 windows 那个 job 建好（needs 保证它先跑完）；这里只补传 Linux 产物
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" electron-dist/*.AppImage electron-dist/*.tar.gz --clobber
          echo "已上传 Linux 产物：$TAG"
